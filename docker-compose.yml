version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:hanaloop@db:5432/hanaloop

    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hanaloop
      POSTGRES_DB: hanaloop
    ports:
      - "5432:5432"
    volumes:
      - ./lib/server/db/init.sql:/docker-entrypoint-initdb.d/init.sql